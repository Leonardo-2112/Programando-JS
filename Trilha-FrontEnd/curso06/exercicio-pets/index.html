<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD de Pets</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <div class="conteudo-cabecalho">
      <div class="logo">
        <img src="imagens/logo.png" alt="">
        <h1>Trechos de músicas,<br> citações de livros e
          <br> <strong>suas melhores ideias
            <br> num só lugar!</strong>
        </h1>
      </div>
      <div class="imagem-cabecalho">
        <img src="imagens/computador-cabecalho.png" alt="">
      </div>
    </div>
  </header>
  <main class="background-overlay">
    <div class="overlay"></div>
    <div class="overlay overlay-color"></div>
    <h2>Adicione um pet novo:</h2>
    <section id="form-container">
      <form id="pet-form">
        <input type="hidden" id="pet-id" />
        <label for="pet-nome">Pet</label>
        <textarea id="pet-nome" placeholder="Digite seu pet">
          </textarea>
        <label for="pet-especie">
          Espécie
        </label>
        <input type="text" id="pet-especie" placeholder="Insira a espécie"/>
        <label for="pet-raca">
          Raça
        </label>
        <input type="text" id="pet-raca" placeholder="Insira a raça do seu pet"/>
        <div class="form-botoes">
          <button type="submit" id="botao-salvar">
            Adicionar
          </button>
          <button type="button" id="botao-cancelar">
            Cancelar
          </button>
        </div>
      </form>
    </section>
    <span></span>
    <section id="lista-pets-container">
      <h3>Meu Mural</h3>
      <ul id="lista-pets"></ul>
    </section>
  </main>
  <footer>
    <p>&copy;
      2024 Desenvolvido por Alura.
      Projeto fictício sem fins comerciais.</p>
  </footer>
  <script type="module" src="api.js"></script>
  <script type="module" src="script.js"></script>

</body>

</html>
